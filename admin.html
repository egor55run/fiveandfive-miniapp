<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Служебная страница: в поиске ей делать нечего. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>FIVE&FIVE — админка</title>
    <!--
      Mini App SDK нужен только для одного случая: если /admin открыли внутри
      Telegram, вход пройдёт по initData и кнопка-виджет не понадобится.
      В обычном браузере скрипт просто не создаёт window.Telegram.WebApp.
      Сам Login Widget подключается динамически из TelegramLoginButton.tsx.
    -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <!--
      Идентификатор намеренно не "root": правило #root в src/index.css сужает
      контейнер до 430px под мобильный Mini App, а админке нужна вся ширина.
      Токены и базовые стили из index.css при этом переиспользуются.
    -->
    <div id="admin-root"></div>
    <script type="module" src="/src/admin/main.tsx"></script>
  </body>
</html>
